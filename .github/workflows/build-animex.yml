    PROVIDER_SOURCE_JAVDAY = 4,
};"""
          if old not in s:
              raise SystemExit("provider enum target not found")
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = root / "nxanime_source/provider.cpp"
          s = p.read_text()
          s = s.replace(
