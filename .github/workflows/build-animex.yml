name: Build ANIMEX NRO

on:
  push:
    branches:
      - animex-nro-build
    paths:
      - 'animex_payload/**'
      - '.github/workflows/build-animex.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
      options: --user root

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      PORTLIBS: /opt/devkitpro/portlibs/switch
      LIBNX: /opt/devkitpro/libnx
      PKG_CONFIG_PATH: /opt/devkitpro/portlibs/switch/lib/pkgconfig:/opt/devkitpro/libnx/lib/pkgconfig

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore ANIMEX source
        run: |
          set -euxo pipefail
          test "$(find animex_payload -maxdepth 1 -name 'part*.b64' | wc -l)" -eq 19
          cat animex_payload/part*.b64 > animex-source.tar.gz.b64
          base64 -d animex-source.tar.gz.b64 > animex-source.tar.gz
          echo "e95de0f5bb5a3886d56a95e4c28b5e34a2dfb5ffc9d808cc58b6a2075e0b47f6  animex-source.tar.gz" | sha256sum -c -
          mkdir -p animex-src
          tar -xzf animex-source.tar.gz -C animex-src
          test -f animex-src/Makefile
          test -f animex-src/icon.jpg
          test -f animex-src/nxanime_source/main.cpp

      - name: Apply developer edition icon
        run: |
          set -euxo pipefail
          test -s animex_payload/dev_icon.jpg
          cp animex_payload/dev_icon.jpg animex-src/icon.jpg
          sha256sum animex-src/icon.jpg

      - name: Set ANIMEX version 0.8.3
        run: |
          set -euxo pipefail
          cd animex-src
          grep -RIl '0\.8\.1' . | xargs -r sed -i 's/0\.8\.1/0.8.3/g'
          grep -RIn '0\.8\.3' . | head -30 || true

      - name: Enable libnx SSL service for FFmpeg HTTPS
        run: |
          set -euxo pipefail
          sed -i 's/bool socket_ok=false,provider_ok=false,connected=false;/bool socket_ok=false,ssl_ok=false,provider_ok=false,connected=false;/' animex-src/nxanime_source/main.cpp
          awk '
            { print }
            /        st.socket_ok=true;/ { inject=1; next }
            inject && /    }/ {
              print "    if(!st.ssl_ok){"
              print "        Result rc=sslInitialize(3);"
              print "        if(R_FAILED(rc)){"
              print "            char t[96];snprintf(t,sizeof(t),\"SSL INIT FAILED 0X%08X\",rc);"
              print "            st.status=t;log_stage(st.status.c_str());return;"
              print "        }"
              print "        st.ssl_ok=true;"
              print "    }"
              inject=0
            }
          ' animex-src/nxanime_source/main.cpp > /tmp/main.cpp && mv /tmp/main.cpp animex-src/nxanime_source/main.cpp
          sed -i 's/if(st.provider_ok)provider_exit();if(st.socket_ok)socketExit();/if(st.provider_ok)provider_exit();if(st.ssl_ok)sslExit();if(st.socket_ok)socketExit();/' animex-src/nxanime_source/main.cpp
          grep -n 'ssl_ok\|sslInitialize\|sslExit' animex-src/nxanime_source/main.cpp

      - name: Apply movie playback and poster fixes
        run: |
          set -euxo pipefail
          cd animex-src
          patch -p1 < ../animex_payload/movie-play-cover-fix.patch
          grep -n 'media_probe_movie_url\|special_attempts' nxanime_source/media_resolver.cpp
          grep -n 'cover_workers' nxanime_source/main.cpp
          grep -n 'elapsed>=0\|return 480' nxanime_source/cover.cpp

      - name: Apply broader movie playback compatibility
        run: |
          set -euxo pipefail
          cd animex-src
          patch -p1 < ../animex_payload/greenbook-playback-compat.patch
          grep -n 'KANJU_YJ_BASE\|kanju_api_post\|resolve-line' nxanime_source/provider.cpp
          grep -n 'json_http_url' nxanime_source/media_resolver.cpp

      - name: Apply ANIMEX 0.8.3 stability and speed tuning
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("animex-src")
          # Version: UI, NACP metadata, startup log and HTTP UA tags.
          for rel in ["Makefile", "nxanime_source/main.cpp", "nxanime_source/provider.cpp",
                      "nxanime_source/media_resolver.cpp", "nxanime_source/cover.cpp"]:
              p = root / rel
              s = p.read_text()
              s = s.replace("0.8.1", "0.8.3")
              p.write_text(s)

          # KANJU API: fail faster on a dead edge instead of inheriting 30-40s
          # carrier budgets. Two attempts still retain IPv4 fallback.
          p = root / "nxanime_source/provider.cpp"
          s = p.read_text()
          old = """    NetworkOptions options;
              options.network_mode = proxy.network_mode;
              options.allow_ipv4_fallback = proxy.mode == PROXY_MODE_DIRECT;
              network_apply_proxy(c, proxy);
              const NetworkResult result = network_perform_get(
                  c, VideoNetworkStage::Api, reset_string_response, &body, options,
                  g_provider_cancel);"""
          new = """    NetworkOptions options;
              options.connect_timeout_seconds = 4;
              options.total_timeout_seconds = 10;
              options.low_speed_seconds = 4;
              options.max_attempts = 2;
              options.network_mode = 0;
              options.allow_ipv4_fallback = proxy.mode == PROXY_MODE_DIRECT;
              options.user_agent =
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                  "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36";
              network_apply_proxy(c, proxy);
              const NetworkResult result = network_perform_get(
                  c, VideoNetworkStage::Api, reset_string_response, &body, options,
                  g_provider_cancel);"""
          if old not in s:
              raise SystemExit("KANJU GET tuning target not found")
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Movie probe: a bad line should be abandoned quickly so the next
          # resolver candidate can be tried instead of freezing the UI.
          p = root / "nxanime_source/media_resolver.cpp"
          s = p.read_text()
          s = s.replace("options.connect_timeout_seconds = 4;\n    options.total_timeout_seconds = 7;\n    options.low_speed_seconds = 3;",
                        "options.connect_timeout_seconds = 3;\n    options.total_timeout_seconds = 5;\n    options.low_speed_seconds = 2;", 1)
          s = s.replace(
              '"Mozilla/5.0 (Nintendo Switch; ANIMEX/0.8.3) AppleWebKit/537.36"',
              '"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"')
          p.write_text(s)

          # Treat every movie as an online smooth-stream source even when the
          # resolved URL has no .m3u8 suffix. This keeps deeper probing,
          # buffering and audio detection enabled for extensionless CDN links.
          p = root / "nxanime_source/player.cpp"
          s = p.read_text()
          import re
          s, n = re.subn(
              r'(const bool online_video_smooth\s*=\s*!anime_cdn\s*&&\s*\()source\.hls\s*\|\|',
              r'\1source.movie || source.hls ||',
              s, count=1)
          if n == 0 and "source.movie || source.hls" not in s:
              raise SystemExit("player smooth-stream target not found")
          ua_old = 'request.user_agent = "Mozilla/5.0 (Nintendo Switch; ANIMEX) AppleWebKit/537.36";'
          ua_new = '''request.user_agent = source.movie
                  ? "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
                  : "Mozilla/5.0 (Nintendo Switch; ANIMEX) AppleWebKit/537.36";'''
          if ua_old in s:
              s = s.replace(ua_old, ua_new, 1)
          elif "source.movie" not in s or "Chrome/126.0.0.0" not in s:
              raise SystemExit("player UA target not found")
          # Validated movie lines do not need a 15s open stall before failover.
          s = s.replace("now_ns() + (source.movie ? 15'000'000'000ULL : 30'000'000'000ULL)",
                        "now_ns() + (source.movie ? 12'000'000'000ULL : 30'000'000'000ULL)", 1)
          p.write_text(s)

          # Six workers each racing two CDNs can create 12 simultaneous sockets.
          # Keep six visible workers, but stagger the backup CDN very slightly
          # to improve real-world throughput and stability on Switch Wi-Fi.
          p = root / "nxanime_source/cover.cpp"
          s = p.read_text()
          s = s.replace("elapsed>=0", "elapsed>=120", 1)
          p.write_text(s)
          PY
          grep -RIn '0.8.3' animex-src/Makefile animex-src/nxanime_source/main.cpp | head -20
          grep -n 'source.movie || source.hls' animex-src/nxanime_source/player.cpp
          grep -n 'elapsed>=120' animex-src/nxanime_source/cover.cpp

      - name: Add JAVDAY external web source
        run: |
          set -euxo pipefail
          python3 animex_payload/add_javday_source.py animex-src
          grep -RIn 'PROVIDER_SOURCE_JAVDAY\|javday.app\|webapp://' animex-src/nxanime_source | head -80

      - name: Fix JAVDAY native playback covers categories and PIN
        run: |
          set -euxo pipefail
          python3 animex_payload/javday_native_fix_v2.py animex-src
          grep -RIn 'JAVDAY_FILTER_CHANNELS\|javday_pin_prompt\|background-image\|special_movie\|javday_cover' animex-src/nxanime_source | head -120

      - name: Apply developer version label
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("animex-src")

          # Keep NACP/build metadata ASCII and short for Switch compatibility.
          p = root / "Makefile"
          s = p.read_text()
          s = s.replace("APP_VERSION := 0.8.3", "APP_VERSION := 0.8.3-dev")
          p.write_text(s)

          # User-facing version string requested by the developer.
          p = root / "nxanime_source/main.cpp"
          s = p.read_text()
          s = s.replace('"V.0.8.3"', '"v.开发者版本"')
          s = s.replace('"v0.8.3 · 多源代理启动器"', '"v.开发者版本 · 多源代理启动器"')
          s = s.replace('"0.8.3 SOURCE LAUNCHER"', '"开发者版本 SOURCE LAUNCHER"')
          s = s.replace('"v0.8.3"', '"v.开发者版本"')
          s = s.replace('"ANIMEX 0.8.3 startup\\n"', '"ANIMEX 开发者版本 startup\\n"')
          p.write_text(s)
          PY
          grep -n '开发者版本\|APP_VERSION' animex-src/nxanime_source/main.cpp animex-src/Makefile | head -40

      - name: Package assembled developer source
        run: |
          set -euxo pipefail
          cat > animex-src/SOURCE_BUILD_INFO.txt <<'EOF'
          ANIMEX v.开发者版本
          Developer: LINKO
          Adult frontend name: 成人专区🔞
          Internal provider id/protocol: JAVDAY (kept for compatibility)
          Adult zone PIN: SEX
          This source tree is the assembled source after all current build-time patches/transforms.
          EOF
          rm -f animex-src/ANIMEX.nro animex-src/ANIMEX.elf animex-src/ANIMEX.map
          find animex-src -maxdepth 2 -type f | sort | sed -n '1,120p'

      - name: Upload assembled source
        uses: actions/upload-artifact@v4
        with:
          name: ANIMEX-DEVELOPER-SOURCE
          path: |
            animex-src/Makefile
            animex-src/FFMPEG_HTTPS_FLAGS.txt
            animex-src/BUILD_NOTES.txt
            animex-src/SOURCE_BUILD_INFO.txt
            animex-src/icon.jpg
            animex-src/nxanime_source/**
          if-no-files-found: error

      - name: Package ANIMEX 0.8.3 source
        run: |
          set -euxo pipefail
          cp -a animex-src ANIMEX-0.8.3-source
          rm -f ANIMEX-0.8.3-source/ANIMEX.nro ANIMEX-0.8.3-source/ANIMEX.elf
          tar -czf ANIMEX-0.8.3-source.tar.gz ANIMEX-0.8.3-source

      - name: Upload ANIMEX 0.8.3 source
        uses: actions/upload-artifact@v4
        with:
          name: ANIMEX-0.8.3-source
          path: ANIMEX-0.8.3-source.tar.gz
          if-no-files-found: error

      - name: Ensure Switch libraries
        run: |
          set -euxo pipefail
          required="switch-dev switch-pkg-config switch-curl switch-freetype switch-libpng switch-libjpeg-turbo switch-libwebp switch-sdl2 switch-ffmpeg switch-zlib switch-bzip2 switch-libass switch-libfribidi switch-dav1d"
          missing=""
          for p in $required; do
            if ! dkp-pacman -Q "$p" >/dev/null 2>&1; then
              missing="$missing $p"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing packages:$missing"
            for i in 1 2 3; do
              dkp-pacman -Sy --noconfirm && break || true
              sleep 5
            done
            dkp-pacman -S --needed --noconfirm $missing
          fi

      - name: Build FFmpeg 7.1 with HTTPS protocol
        run: |
          set -euxo pipefail
          rm -rf /tmp/ffmpeg-build /tmp/dkp-pacman-packages
          mkdir -p /tmp/ffmpeg-build
          git clone --depth 1 https://github.com/devkitPro/pacman-packages.git /tmp/dkp-pacman-packages
          cd /tmp/ffmpeg-build
          curl -fL --retry 4 --retry-delay 3 -o ffmpeg-7.1.tar.xz https://ffmpeg.org/releases/ffmpeg-7.1.tar.xz
          tar -xf ffmpeg-7.1.tar.xz
          cd ffmpeg-7.1
          patch -Np1 -i /tmp/dkp-pacman-packages/switch/ffmpeg/ffmpeg-7.1.patch
          patch -Np1 -i /tmp/dkp-pacman-packages/switch/ffmpeg/tls.patch
          source /opt/devkitpro/switchvars.sh
          ./configure --prefix="$PORTLIBS_PREFIX" --enable-gpl --disable-shared --enable-static \
            --cross-prefix=aarch64-none-elf- --enable-cross-compile \
            --arch=aarch64 --cpu=cortex-a57 --target-os=horizon --enable-pic \
            --extra-cflags='-D__SWITCH__ -D_GNU_SOURCE -O2 -march=armv8-a -mtune=cortex-a57 -mtp=soft -fPIC -ftls-model=local-exec' \
            --extra-cxxflags='-D__SWITCH__ -D_GNU_SOURCE -O2 -march=armv8-a -mtune=cortex-a57 -mtp=soft -fPIC -ftls-model=local-exec' \
            --extra-ldflags="-fPIE -L$PORTLIBS_PREFIX/lib -L$DEVKITPRO/libnx/lib" \
            --disable-runtime-cpudetect --disable-programs --disable-debug --disable-doc --disable-autodetect \
            --enable-asm --enable-neon \
            --disable-avdevice --disable-encoders --disable-muxers \
            --enable-swscale --enable-swresample --enable-network \
            --disable-protocols --enable-protocol=file,http,https,ftp,tcp,udp,rtmp,tls,httpproxy \
            --enable-zlib --enable-bzlib --enable-libass --enable-libfreetype --enable-libfribidi --enable-libdav1d \
            --enable-libnx --enable-nvtegra
          grep -n 'ff_https_protocol\|ff_crypto_protocol\|ff_data_protocol' libavformat/protocol_list.c
          make -j"$(nproc)"
          make install

      - name: Verify streaming protocols in FFmpeg
        run: |
          set -euxo pipefail
          proto=/tmp/ffmpeg-build/ffmpeg-7.1/libavformat/protocol_list.c
          grep -n 'ff_http_protocol' "$proto"
          grep -n 'ff_https_protocol' "$proto"
          grep -n 'ff_crypto_protocol' "$proto"
          grep -n 'ff_data_protocol' "$proto"
          grep -n 'ff_tcp_protocol' "$proto"
          grep -n 'ff_tls_protocol' "$proto"
          grep -n 'ff_httpproxy_protocol' "$proto"
          pkg-config --modversion libavformat libavcodec libavutil libswscale libswresample

      - name: Build ANIMEX
        working-directory: animex-src
        run: |
          set -euxo pipefail
          make clean || true
          make -j"$(nproc)"
          test -s ANIMEX.nro
          ls -lh ANIMEX.nro
          sha256sum ANIMEX.nro

      - name: Upload ANIMEX NRO
        uses: actions/upload-artifact@v4
        with:
          name: ANIMEX-DEVELOPER-ADULT-ZONE
          path: animex-src/ANIMEX.nro
          if-no-files-found: error
