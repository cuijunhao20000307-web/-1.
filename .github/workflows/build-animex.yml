              raise SystemExit("play helper insertion target not found")
          s = s.replace(insert_before, helper + insert_before, 1)

          old = """        const EpisodeItem epitem=st.detail.episodes[st.ep];
        st.screen=EPISODE;
        st.status="视频正在缓冲中";"""
          new = """        const EpisodeItem epitem=st.detail.episodes[st.ep];
        if(epitem.url.rfind("webapp://",0)==0){
            const std::string page_url=epitem.url.substr(9);
            st.screen=DETAIL;
            st.status="正在打开系统网页...";
            draw_frame(fb,st);
            open_external_web_page(st,fb,page_url);
            return;
        }
        st.screen=EPISODE;
        st.status="视频正在缓冲中";"""
          if old not in s:
              raise SystemExit("webapp playback interception target not found")
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          grep -RIn 'PROVIDER_SOURCE_JAVDAY\|javday.app\|webapp://' animex-src/nxanime_source | head -80

      - name: Ensure Switch libraries
        run: |
          set -euxo pipefail
          required="switch-dev switch-pkg-config switch-curl switch-freetype switch-libpng switch-libjpeg-turbo switch-libwebp switch-sdl2 switch-ffmpeg switch-zlib switch-bzip2 switch-libass switch-libfribidi switch-dav1d"
          missing=""
          for p in $required; do
            if ! dkp-pacman -Q "$p" >/dev/null 2>&1; then
              missing="$missing $p"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing packages:$missing"
            for i in 1 2 3; do
              dkp-pacman -Sy --noconfirm && break || true
              sleep 5
            done
            dkp-pacman -S --needed --noconfirm $missing
          fi

      - name: Build FFmpeg 7.1 with HTTPS protocol
        run: |
          set -euxo pipefail
          rm -rf /tmp/ffmpeg-build /tmp/dkp-pacman-packages
          mkdir -p /tmp/ffmpeg-build
          git clone --depth 1 https://github.com/devkitPro/pacman-packages.git /tmp/dkp-pacman-packages
          cd /tmp/ffmpeg-build
          curl -fL --retry 4 --retry-delay 3 -o ffmpeg-7.1.tar.xz https://ffmpeg.org/releases/ffmpeg-7.1.tar.xz
          tar -xf ffmpeg-7.1.tar.xz
          cd ffmpeg-7.1
          patch -Np1 -i /tmp/dkp-pacman-packages/switch/ffmpeg/ffmpeg-7.1.patch
          patch -Np1 -i /tmp/dkp-pacman-packages/switch/ffmpeg/tls.patch
          source /opt/devkitpro/switchvars.sh
          ./configure --prefix="$PORTLIBS_PREFIX" --enable-gpl --disable-shared --enable-static \
            --cross-prefix=aarch64-none-elf- --enable-cross-compile \
            --arch=aarch64 --cpu=cortex-a57 --target-os=horizon --enable-pic \
            --extra-cflags='-D__SWITCH__ -D_GNU_SOURCE -O2 -march=armv8-a -mtune=cortex-a57 -mtp=soft -fPIC -ftls-model=local-exec' \
            --extra-cxxflags='-D__SWITCH__ -D_GNU_SOURCE -O2 -march=armv8-a -mtune=cortex-a57 -mtp=soft -fPIC -ftls-model=local-exec' \
            --extra-ldflags="-fPIE -L$PORTLIBS_PREFIX/lib -L$DEVKITPRO/libnx/lib" \
            --disable-runtime-cpudetect --disable-programs --disable-debug --disable-doc --disable-autodetect \
            --enable-asm --enable-neon \
            --disable-avdevice --disable-encoders --disable-muxers \
            --enable-swscale --enable-swresample --enable-network \
            --disable-protocols --enable-protocol=file,http,https,ftp,tcp,udp,rtmp,tls,httpproxy \
            --enable-zlib --enable-bzlib --enable-libass --enable-libfreetype --enable-libfribidi --enable-libdav1d \
            --enable-libnx --enable-nvtegra
          grep -n 'https_protocol' libavformat/protocol_list.c || grep -n 'ff_https' libavformat/protocol_list.c || true
          make -j"$(nproc)"
          make install

      - name: Verify HTTPS protocol in FFmpeg
        run: |
          set -euxo pipefail
          grep -n 'https_protocol' /tmp/ffmpeg-build/ffmpeg-7.1/libavformat/protocol_list.c || grep -n 'ff_https' /tmp/ffmpeg-build/ffmpeg-7.1/libavformat/protocol_list.c || true
          pkg-config --modversion libavformat libavcodec libavutil libswscale libswresample

      - name: Build ANIMEX
        working-directory: animex-src
        run: |
          set -euxo pipefail
          make clean || true
          make -j"$(nproc)"
          test -s ANIMEX.nro
          ls -lh ANIMEX.nro
          sha256sum ANIMEX.nro

      - name: Upload ANIMEX NRO
        uses: actions/upload-artifact@v4
        with:
          name: ANIMEX-0.8.3-JAVDAY
          path: animex-src/ANIMEX.nro
          if-no-files-found: error
